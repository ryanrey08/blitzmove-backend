# BlitzMove API for local development: php-fpm + nginx + MySQL + Redis + phpMyAdmin.
#   docker compose up -d --build
#   docker compose exec app php artisan migrate --seed
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blitzmove-app
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - vendor_data:/var/www/vendor
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    command: sh -c "git config --global --add safe.directory /var/www || true; [ -f .env ] || cp .env.example .env; [ -f vendor/autoload.php ] || composer install --no-interaction; (grep -q '^APP_KEY=base64:' .env || php artisan key:generate --force) && php-fpm"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: blitzmove-nginx
    ports:
      - "${APP_PORT:-8100}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: blitzmove-db
    environment:
      MYSQL_DATABASE: blitzmove
      MYSQL_USER: blitzmove
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blitzmove-redis
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: blitzmove-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: blitzmove
      PMA_PASSWORD: secret
    ports:
      - "${PHPMYADMIN_PORT:-8180}:80"
    depends_on:
      - db

volumes:
  mysql_data:
  vendor_data:
