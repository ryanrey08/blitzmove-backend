# Runs the API and MySQL on their own. For the full stack use ../docker-compose.yml.
name: blitzmove-backend

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-blitzmove}
      MYSQL_USER: ${DB_USERNAME:-blitzmove}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8080"
    volumes:
      - backend-storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  backend-storage:
