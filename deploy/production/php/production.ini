expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 12M
post_max_size = 14M
max_execution_time = 60

opcache.enable = 1
opcache.memory_consumption = 96
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

session.cookie_httponly = 1
session.cookie_secure = 1
