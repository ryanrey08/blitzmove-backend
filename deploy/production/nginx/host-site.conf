# Host nginx site for BlitzMove: /etc/nginx/sites-available/blitzmove (symlinked into sites-enabled).
# Replace blitzmove.example.com with the real domain. One domain serves both apps:
#   /api/v1/*, /up  -> Laravel API  (blitzmove "web" container, 127.0.0.1:8100)
#   everything else -> Next.js      (blitzmove "frontend" container, 127.0.0.1:3100)
# Certificate: certbot certonly --webroot -w /var/www/letsencrypt -d blitzmove.example.com

server {
    listen 80;
    listen [::]:80;
    server_name blitzmove.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blitzmove.example.com;

    ssl_certificate     /etc/letsencrypt/live/blitzmove.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blitzmove.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;

    server_tokens off;
    autoindex off;
    client_max_body_size 14m;

    # The apps set some of these too; hide theirs so each header is sent once.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Powered-By;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    location ~ /\.(?!well-known) { return 404; }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8100;
        include proxy_params;
        proxy_read_timeout 120s;
    }

    location = /up {
        proxy_pass http://127.0.0.1:8100;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
