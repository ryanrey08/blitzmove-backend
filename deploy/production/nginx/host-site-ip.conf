# Host nginx site for the bare IP: /etc/nginx/sites-available/blitzmove-ip.
# BlitzMove now lives on https://blitzmove.blitzdev.com.ph, so plain-HTTP visits to the IP are sent there.
# An exact server_name beats SofiaCart's 444 default_server, so only requests for this IP land here.
server {
    listen 80;
    server_name 134.209.100.226;
    server_tokens off;
    return 301 https://blitzmove.blitzdev.com.ph$request_uri;
}
