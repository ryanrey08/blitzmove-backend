# Host nginx site for BlitzMove on the bare IP over plain HTTP, until a domain exists:
# /etc/nginx/sites-available/blitzmove-ip. An exact server_name beats SofiaCart's 444 default_server,
# so only requests for this IP reach BlitzMove; SofiaCart's own config is not changed.
# No TLS: public CAs don't issue certificates for this kind of setup, so logins travel unencrypted.
# Replace with host-site.conf once a domain points here.

server {
    listen 80;
    server_name 134.209.100.226;

    server_tokens off;
    autoindex off;
    client_max_body_size 14m;

    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Powered-By;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    location ~ /\.(?!well-known) { return 404; }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8100;
        include proxy_params;
        proxy_read_timeout 120s;
    }

    location = /up {
        proxy_pass http://127.0.0.1:8100;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
